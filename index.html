<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>預備青年卡註冊</title>

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #fff8f9;
      color: #3f3034;
    }

    .top {
      background: linear-gradient(180deg, #ffe8ef, #fff6f8);
      padding: 28px 24px 24px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(210, 130, 150, 0.15);
    }

    .name {
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      font-size: 13px;
      color: #8b7278;
      margin-top: 4px;
    }

    .unlock {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px 16px;
      color: #d25f84;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 6px 16px rgba(210, 130, 150, 0.12);
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 30px 22px 60px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 28px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 15px;
    }

    .label-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff0f4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b66a78;
      font-size: 18px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #f2cbd5;
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 15px;
      background: #ffffff;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #d97898;
      box-shadow: 0 0 0 3px rgba(217, 120, 152, 0.12);
    }

    .upload-box {
      border: 1.5px dashed #efb8c6;
      border-radius: 18px;
      background: #fffafd;
      padding: 36px 20px;
      text-align: center;
      color: #8b7278;
      cursor: pointer;
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffe6ee;
      color: #d25f84;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 22px;
    }

    .upload-title {
      font-weight: 700;
      color: #4c3a40;
      margin-bottom: 6px;
    }

    .upload-note {
      font-size: 13px;
      color: #9a7f86;
    }

    .notice {
      margin-left: 178px;
      margin-top: -8px;
      margin-bottom: 26px;
      font-size: 13px;
      color: #d25f84;
    }

    button {
      width: calc(100% - 178px);
      margin-left: 178px;
      border: none;
      border-radius: 14px;
      padding: 17px;
      background: linear-gradient(135deg, #d86f91, #c55d80);
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(210, 100, 130, 0.25);
    }

    button:hover {
      opacity: 0.92;
    }

    .result {
      display: none;
      margin-top: 26px;
      margin-left: 178px;
      background: #fff0f4;
      border: 1px solid #f3c5d0;
      color: #9d5168;
      border-radius: 14px;
      padding: 16px;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .container {
        padding: 26px 18px 50px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .notice,
      button,
      .result {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <div class="top">
    <div class="profile">
      <div class="avatar"></div>
      <div>
        <div class="name">青年卡使用者</div>
        <div class="status">Lv.1 新手探索者｜Beta Points：0</div>
      </div>
    </div>

    <div class="unlock">
      試辦青年卡解鎖條件：完成 3 項任務
    </div>
  </div>

  <div class="container">
    <h2>我要註冊</h2>

    <div class="form-row">
      <div class="label">
        <div class="label-icon">人</div>
        姓名／暱稱
      </div>
      <input type="text" placeholder="請輸入姓名或暱稱">
    </div>

    <div class="form-row">
      <div class="label">
        <div class="label-icon">校</div>
        學校／身分
      </div>
      <input type="text" placeholder="請輸入學校或身分">
    </div>

    <div class="form-row">
      <div class="label">
        <div class="label-icon">信</div>
        Email
      </div>
      <input type="email" placeholder="請輸入 Email">
    </div>

    <div class="form-row">
      <div class="label">
        <div class="label-icon">電</div>
        手機
      </div>
      <input type="tel" placeholder="請輸入手機號碼">
    </div>

    <div class="form-row">
      <div class="label">
        <div class="label-icon">日</div>
        生日
      </div>
      <input type="date">
    </div>

    <div class="form-row">
      <div class="label">
        <div class="label-icon">類</div>
        任務興趣
      </div>
      <select>
        <option>請選擇感興趣的任務類型</option>
        <option>城市探索</option>
        <option>公共參與</option>
        <option>風險判讀</option>
        <option>創意表達</option>
        <option>成長實踐</option>
      </select>
    </div>

    <div class="form-row">
      <div class="label">
        <div class="label-icon">證</div>
        身分驗證
      </div>

      <label class="upload-box">
        <input type="file" accept="image/*" style="display:none">
        <div class="upload-icon">拍</div>
        <div class="upload-title">點擊拍照或上傳身分證正面</div>
        <div class="upload-note">支援 JPG、PNG，檔案大小建議不超過 10MB</div>
      </label>
    </div>

    <div class="notice">
      ※ 請確保照片清晰可辨識，資料僅用於青年卡資格驗證。
    </div>

    <button onclick="submitForm()">送出註冊</button>

    <div id="result" class="result">
      註冊資料已送出，系統將建立你的預備青年卡。
    </div>
  </div>

  <script>
    function submitForm() {
      document.getElementById("result").style.display = "block";
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }
  </script>

</body>
</html>
